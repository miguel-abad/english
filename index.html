<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fichas de Inglés</title>
        <link rel="stylesheet" href="estilos.css">
    </head>
    <body>

        <header class="encabezado">
            <div class="contenedor">
                <h1>📚 Fichas de Inglés</h1>
                <p>Biblioteca de fichas y materiales de clase</p>
            </div>
        </header>

        <main class="contenedor">
            <section class="panel-filtros">
                <div class="campo">
                    <label for="filtroGrado">Grado</label>
                    <select id="filtroGrado">
                        <option value="todos">Todos los grados</option>
                        <option value="1P">1P</option>
                        <option value="2P">2P</option>
                        <option value="3P">3P</option>
                        <option value="4P">4P</option>
                        <option value="5P">5P</option>
                        <option value="6P">6P</option>
                        <option value="S1">S1</option>
                        <option value="S2">S2</option>
                        <option value="S3">S3</option>
                        <option value="S4">S4</option>
                        <option value="S5">S5</option>
                    </select>
                </div>
                <div class="campo busqueda">
                    <label for="buscar">Buscar</label>
                    <input type="search" id="buscar" placeholder="Buscar ficha...">
                </div>
            </section>

            <div id="contador" class="contador">Cargando fichas... </div>

            <section id="galeria" class="galeria"> </section>

            <div id="sinResultados" class="sin-resultados" style="display:none;">
                <div class="icono">🔍</div>
                <h2>No se encontraron fichas</h2>
                <p>Prueba con otro grado o término de búsqueda.</p>
            </div>
        </main>

        <div id="visor"
            class="visor">
            <button id="cerrarVisor" class="cerrar" aria-label="Cerrar">×</button>

            <button id="anterior" class="flecha izquierda" aria-label="Imagen anterior"> ❮ </button>
            
            <div class="visor-contenido">
                <img id="imagenGrande" src=""alt="">
                <div id="nombreImagen" class="nombre-imagen"></div>
            </div>
            
            <button id="siguiente" class="flecha derecha" aria-label="Imagen siguiente"> ❯ </button>

        </div>
        <script src="script.js"></script>
    </body>
</html>
