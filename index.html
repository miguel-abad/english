<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Miguel Abad | Fichas de Inglés</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="estilos.css">
        <link rel="icon" type="image/png" sizes="32x32" href="https://miguel-abad.github.io/images/icono/mig-blue.ico">
    </head>
    <body>
        
        <nav class="navbar navbar-expand-lg navbar-dark stronger">
            <div class="container">
                <a class="navbar-brand" href="https://miguel-abad.github.io">
                    <img class="escudo" src="https://miguel-abad.github.io/images/icono/mig-blue.ico" alt="escudo de la web">
                    <h1>Miguel Abad</h1>
                </a>
            </div>
        </nav>

        <!-- Navbar 2 -->
        <nav class="navbar navbar-expand-lg navbar-dark prim py-4">
            <div class="container"><a class="wt" href="https://herr-abad.github.io/">Docente de Idiomas e Informática</a></div>
        </nav>

        <main class="contenedor">
            <div class="container">
                <section class="panel-filtros">
                    <div class="campo">
                        <label for="filtroGrado">Grado</label>
                        <select id="filtroGrado">
                            <option value="todos">Todos los grados</option>
                            <option value="1P">1P</option>
                            <option value="2P">2P</option>
                            <option value="3P">3P</option>
                            <option value="4P">4P</option>
                            <option value="5P">5P</option>
                            <option value="6P">6P</option>
                            <option value="S1">S1</option>
                            <option value="S2">S2</option>
                            <option value="S3">S3</option>
                            <option value="S4">S4</option>
                            <option value="S5">S5</option>
                        </select>
                    </div>
                    <div class="campo busqueda">
                        <label for="buscar">Buscar</label>
                        <input type="search" id="buscar" placeholder="Buscar ficha...">
                    </div>
                </section>
                <div id="contador" class="contador">Cargando fichas... </div>

            </div>

            <section id="galeria" class="galeria grs"> </section>

            <div id="sinResultados" class="sin-resultados" style="display:none;">
                <div class="icono">🔍</div>
                <h2>No se encontraron fichas</h2>
                <p>Prueba con otro grado o término de búsqueda.</p>
            </div>

        </main>

        <div id="visor" class="visor">
            <button id="cerrarVisor" class="cerrar" aria-label="Cerrar">×</button>
            <button id="anterior" class="flecha izquierda" aria-label="Imagen anterior"> ❮ </button>
            
            <div class="visor-contenido">
                <img id="imagenGrande" src=""alt="">
                <div id="nombreImagen" class="nombre-imagen"></div>
            </div>
            
            <button id="siguiente" class="flecha derecha" aria-label="Imagen siguiente"> ❯ </button>
        </div>

        <!-- Separador -->
        <div class="navbar navbar-expand-lg navbar-dark stronger py-3">
            <div class="container">
            <p class="wt">2025 – actualidad, Portafolio desarrollado por <a class="wt" href="https://miguel-abad.github.io/">Miguel Abad</a></p>
            <a href="#top" class="btn btn-primary back-to-top" title="Volver arriba">  ↑  </a>
            </div>
        </div>

        <script src="script.js"></script>
        
    </body>
</html>
